[metadata]
name = tinderbotz
version = 1.6
description = Tinder automated bot and data scraper
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Frederik Mees
author_email = frederik.mees@gmail.com
url = https://github.com/frederikme/TinderBotz
download_url = https://github.com/frederikme/TinderBotz/archive/1.6.tar.gz
keywords = Tinder, Automation, bot
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Topic :: Software Development :: Build Tools
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
packages = find:
install_requires =
    selenium>=4.26,<5
    Pillow==9.5.0
    requests

[options.packages.find]
include =
    tinderbotz
    tinderbotz.*

[options.extras_require]
analysis =
    deepface
    opencv-python
    numpy
